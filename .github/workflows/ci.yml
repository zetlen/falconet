# falconet's own tests, on every pull request and every push to main.
#
# The suite serves a fake GitHub API on loopback, stubs tofu and gitleaks with
# bash scripts handed in through $TOFU and $GITLEAKS, pushes only into bare
# repositories under a temp directory, and never touches the network, GitHub,
# OpenTofu or any credential — which is why it can run here with no secrets
# and no permissions at all. It runs once, through the binary this job builds:
# since #19 there is nothing else in the tree that can answer it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The shell that is left: the suite and its fixtures.
      - name: Check the shell parses before running any of it
        run: |
          set -euo pipefail
          for f in tests/*.sh tests/fixtures/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
          done

      # No setup-go action: every third-party action already floats on a tag
      # (#2), and this would be one more. go.mod's `toolchain` line is the
      # pin; exporting it as GOTOOLCHAIN makes the go command use exactly that
      # version — downloading it when the runner's is older, and refusing to
      # quietly substitute a newer one. One source of truth, read here.
      - name: Pin the Go toolchain to go.mod's
        run: |
          set -euo pipefail
          tc="$(sed -n 's/^toolchain //p' go.mod)"
          test -n "$tc"
          echo "GOTOOLCHAIN=$tc" >> "$GITHUB_ENV"
      - name: Go version
        run: go version

      # vet, staticcheck and errcheck are the fail-closed discipline ADR-0006
      # D1 chose instead of a type system: an ignored error is a red build.
      # They are pinned dev tools, not module dependencies. govulncheck joined
      # them with the one module dependency (#11): golang.org/x/crypto, for
      # the sealed box, is the first thing in go.mod a vulnerability report
      # could name, and a red build is how that report is read.
      - name: Vet, lint, and refuse ignored errors
        run: |
          set -euo pipefail
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/kisielk/errcheck@v1.20.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/errcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The records: every ADR names the charter invariant it serves and the
      # observation that should retire it, every accepted record is indexed in
      # the register, and nothing links a file that is not in the tree. Its own
      # unit tests run in the step below; this one is here so a broken record
      # fails under its own name instead of inside `go test ./...`.
      - name: The records agree
        run: go run ./tools/docslint

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o dist/falconet ./cmd/falconet

      - name: Run the suite through the binary
        run: FALCONET="$PWD/dist/falconet" bash tests/run.sh
