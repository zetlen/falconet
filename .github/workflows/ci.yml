# falconet's own tests, on every pull request and every push to main.
#
# The suite serves a fake GitHub API on loopback, stubs gitleaks with a bash
# script handed in through $GITLEAKS, pushes only into bare repositories
# under a temp directory, and never touches the network, GitHub or any
# credential — which is why it can run here with no secrets
# and no permissions at all. It runs once, through the binary this job builds.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The shell: the suite and its fixtures.
      - name: Check the shell parses before running any of it
        run: |
          set -euo pipefail
          for f in tests/*.sh tests/fixtures/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
          done

      # No setup-go action: every third-party action already floats on a tag,
      # and this would be one more. go.mod's `toolchain` line is the
      # pin; exporting it as GOTOOLCHAIN makes the go command use exactly that
      # version — downloading it when the runner's is older, and refusing to
      # quietly substitute a newer one. One source of truth, read here.
      - name: Pin the Go toolchain to go.mod's
        run: |
          set -euo pipefail
          tc="$(sed -n 's/^toolchain //p' go.mod)"
          test -n "$tc"
          echo "GOTOOLCHAIN=$tc" >> "$GITHUB_ENV"
      - name: Go version
        run: go version

      # vet, staticcheck and errcheck are the fail-closed discipline: an
      # ignored error is a red build.
      # They are pinned dev tools, not module dependencies. govulncheck reads
      # the standard library and go.mod the same way: a vulnerability report
      # that names either is a red build, and that is how it is read.
      - name: Vet, lint, and refuse ignored errors
        run: |
          set -euo pipefail
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/kisielk/errcheck@v1.20.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/errcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...


      - name: Unit tests
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o dist/falconet ./cmd/falconet

      - name: Run the suite through the binary
        run: FALCONET="$PWD/dist/falconet" bash tests/run.sh

  # On a tag, prove the workflow's pinned refs name THIS tag. A version is a
  # git tag whose falconet.yml pins that same tag on every `uses:` line
  # (operating.md); contract.test.sh checks the lines agree and are a tag, but
  # not that they name the tag being cut — so a tag made without the pin-bump
  # commit (the failure that shipped v1.1.0 still pinning v1.0.0) shows up
  # here, red, on the tag, and the operator re-tags after fixing it.
  tag-pins:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every falconet ref pins this tag
        run: |
          set -euo pipefail
          refs="$(grep -oE '^[[:space:]]*uses: zetlen/falconet@[^[:space:]]+' .github/workflows/falconet.yml | sed 's/^[[:space:]]*//' | sort -u)"
          want="uses: zetlen/falconet@${GITHUB_REF_NAME}"
          if [ "$refs" != "$want" ]; then
            printf 'tag %s, but the workflow pins:\n%s\nexpected every line to be:\n%s\n' \
              "$GITHUB_REF_NAME" "$refs" "$want" >&2
            exit 1
          fi
          printf 'every uses: zetlen/falconet@ ref names %s\n' "$GITHUB_REF_NAME"
