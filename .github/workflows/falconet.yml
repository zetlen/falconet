# falconet — the documented job graph.
#
# gate → implement → publish → contain. Four jobs, and the boundaries between
# them are the security model rather than a tidy diagram:
#
#   the AGENT JOB never holds a token. Not a blanked one — none. Blanking
#   credentials on the agent's step would be best-effort: whether a `uses:`
#   step's env: reaches a composite action's expression context is nothing
#   a workflow can promise. A job with `permissions: {}` and no secrets:
#   block is enforced by GitHub.
#
#   the SCRIPTED JOBS never run the agent. They hold the token and do the
#   mechanics — the branch, the guards, the commit, the push, the pull
#   request — none of which is judgment and none of which an agent should
#   be able to skip, improvise, or be argued out of.
#
#   the EVIDENCE is somebody else's job. falconet opens the pull request
#   and stops; what a reviewer reads about the change is posted on it by
#   the repository's own checks, from credentials that never enter this
#   workflow.
#
#   the HARNESS is the caller's. The agent job installs whatever
#   `harness-setup` says and `falconet implement` runs whatever
#   `harness.command` in falconet.json names, with the prompt on its stdin.
#   The default is the Claude Code CLI with file tools only; anything that
#   meets the README's implement contract may replace it. The job holds no
#   token whichever harness runs, and that — not the harness's own tool
#   allowlist — is what keeps the agent from publishing.
#
#   the LOOP is on the check, never on a guard. After each agent pass the
#   job runs the repository's own check (`check.command` in falconet.json),
#   and a failing check sends the run back to a fresh agent pass with the
#   failure in the handoff directory — at most `max-attempts` times. A
#   guard refusal (the allowlist, the denylist, the rename check, the
#   secret scan) is terminal and reaches no agent: the loop turns on the
#   check verb's word and on nothing else. At the cap the guard-clean work
#   is committed and pushed anyway, and the run ends as a hand-off naming
#   the branch and the failure (principle 4).
#
# ---------------------------------------------------------------------------
# Where falconet comes from
# ---------------------------------------------------------------------------
# Every job installs falconet through this repository's composite action at
# a tag: `uses: zetlen/falconet@vX.Y.Z`, the same literal on every line.
# GitHub fetches the action's repository into the runner's action cache,
# outside the workspace and with no token (it is public). The action
# downloads the falconet binary from that tag's release and checks it
# against the release's checksums.txt. `uses:` cannot take an expression, so
# the tag is a literal here. release-please rewrites every line that carries
# the `# x-release-please-version` marker in the release pull request
# (operating.md), and contract.test.sh refuses a tree where the lines
# disagree, name anything but a tag, or lack the marker. Between releases
# they name the LAST tag, and the action there is that tag's.
#
# Nothing of falconet's is checked out into the consumer's tree: the tag on
# the `uses:` line is the one coordinate.
#
# ---------------------------------------------------------------------------
# The cost of that boundary, stated plainly
# ---------------------------------------------------------------------------
# The branch is pushed the moment a commit exists. A runner is destroyed
# minutes after its job ends, and a hand-off that promises work existing
# only on that runner promises nothing.
#
# A job boundary between the commit and the push opens a window in that
# guard — a small one, but a real one. Two things close it:
#
#   1. `implement` uploads a git BUNDLE of the branch before it ends. The
#      bundle outlives the runner, so the work is durable the instant it
#      exists.
#   2. `publish`'s first verb is the push. Nothing is posted before the
#      branch is on the remote.
#
# So the work is never lost; there is a window of one job hand-off in which it
# is durable as an artifact rather than as a branch. `contain` links the run —
# and therefore the artifact — on every path that stops early.
#
# If that trade is wrong, the alternative is one job with per-step
# credential blanking — a boundary that is best-effort where this one is
# enforced. This file takes the enforceable boundary and pays for it here.

name: falconet

on:
  workflow_call:
    inputs:
      issue:
        description: 'The issue number to work.'
        required: true
        type: number
      config:
        description: 'Path to falconet.json, if not .github/falconet.json.'
        required: false
        type: string
        default: ''
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      max-attempts:
        description: >-
          How many agent passes a run may spend getting the repository's
          own check to pass. The check runs after every pass and a failing
          one sends the run back to a fresh pass with the failure attached;
          at the cap the work is committed, pushed and handed off. With no
          check.command configured the first pass is the only one. The
          agent job as a whole is capped at 60 minutes.
        required: false
        type: number
        default: 3
      harness-setup:
        description: >-
          Shell that puts the agent harness on PATH, run in the agent job
          before the first pass. The default installs the Claude Code CLI,
          which is what the default harness.command in falconet.json runs.
          A repository whose harness.command names something else installs
          it here. This job holds no token: whatever the snippet fetches,
          it fetches as nobody.
        required: false
        type: string
        default: npm install -g @anthropic-ai/claude-code
      model-api-key-env:
        description: >-
          The environment variable the harness reads its model credential
          from. The model-api-key secret is exported under this name, in
          the agent job only, and under no other.
        required: false
        type: string
        default: ANTHROPIC_API_KEY
    secrets:
      app-id:
        description: >-
          A GitHub App registered purely as a credential — no webhook, nothing
          hosted. Output is authored by the app rather than by a person, and
          App-token pushes fire pull_request events, which GITHUB_TOKEN
          pushes do not.
        required: true
      app-private-key:
        required: true
      model-api-key:
        description: >-
          The one credential the agent job holds: the harness's model key,
          exported under model-api-key-env. Deliberately an API key with a
          budget of its own, so falconet's spend stays a separate number.
        required: true

permissions: {}

jobs:
  # =========================================================================
  # gate — is this issue ours, and if so lay out the work
  # =========================================================================
  gate:
    # A bot's event, or a comment on a pull request, is never a way in, and
    # telling needs nothing but the event. falconet's own comments and labels
    # arrive as bot events, so without this each one spends a gate job.
    # Everything that needs the config is decided by `prepare`.
    if: github.event.sender.type != 'Bot' && !github.event.issue.pull_request
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      outcome:   ${{ steps.prepare.outputs.outcome }}
      branch:    ${{ steps.read.outputs.branch }}
      base_sha:  ${{ steps.read.outputs.base_sha }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ steps.token.outputs.token }}

      # The handoff directory is written INSIDE the consumer's tree — it is
      # where the verbs leave files for each other — and it is an untracked
      # path that two verbs will see: prepare refuses a dirty tree, and
      # commit, in the implement job, reads `git status --untracked-files=all`
      # on a tree that carries the downloaded handoff and refuses any changed
      # path outside the allowlist. A run in CI must not depend on the
      # consumer's .gitignore knowing the directory's name, so it is excluded
      # per clone, here, before any verb reads git status; contract.test.sh
      # fails if a step reorders that.
      #
      # Per clone and never committed. A consumer still gitignores the
      # handoff directory for runs by hand; a run in CI must not depend on it.
      - name: Keep the handoff out of the working tree
        run: |
          mkdir -p .git/info
          printf '%s\n' .falconet/ >> .git/info/exclude

      # No verb: this call installs falconet and gitleaks and stops. See the
      # header for where the binary comes from. The action's own checkout is
      # in the runner's action cache, not in this workspace, so nothing here
      # is a path the verbs could trip over.
      - name: Install falconet and gitleaks
        uses: zetlen/falconet@v1.1.2 # x-release-please-version

      # Eligibility that needs the config is decided here and not in a
      # job-level `if:`, because an `if:` evaluates before checkout and can
      # therefore never read the config file. Gating there would fork
      # eligibility into YAML-in-CI and nothing-locally, for a project whose
      # whole rule is one code path. The cost is runner-seconds on a person's
      # ineligible event.
      - name: Prepare
        id: prepare
        uses: zetlen/falconet@v1.1.2 # x-release-please-version
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FALCONET_EVENT_PATH: ${{ github.event_path }}
        with:
          verb: prepare
          setup: 'false'
          args: --issue ${{ inputs.issue }} ${{ inputs.config && format('--config {0}', inputs.config) || '' }}

      - name: Read the handoff
        id: read
        if: steps.prepare.outputs.outcome == 'ready'
        run: |
          set -euo pipefail
          echo "branch=$(cat .falconet/branch.txt)"     >> "$GITHUB_OUTPUT"
          echo "base_sha=$(cat .falconet/base-sha.txt)" >> "$GITHUB_OUTPUT"

      # `include-hidden-files`, because the handoff directory's name starts
      # with a dot and upload-artifact excludes hidden paths by DEFAULT. It
      # does it as a warning — "No files were found with the provided path" —
      # and the step still goes green: without this, gate uploads nothing
      # while reporting success and implement dies two jobs later on an
      # artifact that never existed. `if-no-files-found: error` is the other
      # half: this hand-off is not optional, and a step that finds nothing
      # here has failed whatever the reason.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.prepare.outputs.outcome == 'ready'
        with:
          name: handoff-gate
          path: .falconet/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

      # The agent job cannot check the repository out for itself: it holds no
      # token, and a private repository answers a tokenless clone with
      # "Repository not found". So gate — which has a token and has already
      # used it — hands the checkout over as an artifact, and the boundary
      # stays what it says it is rather than being traded away for a clone.
      #
      # A TARBALL OF THE CHECKOUT, not a bundle. `git bundle create` from a
      # depth-1 clone exits 0 and `git bundle verify` calls the result "a
      # complete history"; cloning it then fails on the first traversal —
      # `error: Could not read <parent>` — because the tip's parent was never
      # fetched and nothing marks the clone shallow. A tar of the working tree
      # WITH its `.git` arrives as precisely the shallow clone gate had, which
      # is what `actions/checkout` would have produced anyway. (The range
      # bundle from implement to publish is a different thing and is sound:
      # both ends already hold the base commit, so the bundle records it as a
      # prerequisite instead of pretending to carry it.)
      #
      # The credential comes out FIRST. checkout writes the token as an
      # extraheader into a git-credentials-*.config file under $RUNNER_TEMP
      # and adds includeIf entries to .git/config that point at it. prepare
      # needs it while it is running — `git ls-remote origin` is how the
      # in-flight branch check sees the remote — and by this step prepare is
      # finished with it. Shipping it would hand the agent job a push-capable
      # token inside a directory it can read, which is the one thing this
      # whole job graph is built to prevent. So every includeIf entry comes
      # out of .git/config, which in a fresh checkout holds only checkout's,
      # the file they name is deleted, and an extraheader written straight
      # into .git/config is unset as well. The names are listed with
      # --name-only so no value, the token's included, reaches the log. The
      # grep is the fail-closed half: if checkout writes the credential, or a
      # pointer to it, anywhere else in .git/config, nothing ships at all.
      #
      # The handoff is excluded from the tar: it travels as its own artifact.
      - name: Hand the checkout to the agent job, without the credential
        id: source
        if: steps.prepare.outputs.outcome == 'ready'
        run: |
          set -euo pipefail
          includes="$(git config --local --name-only --get-regexp '^includeif\.' | sort -u || true)"
          while IFS= read -r key; do
            if [ -n "$key" ]; then git config --local --unset-all "$key"; fi
          done <<<"$includes"
          rm -f "$RUNNER_TEMP"/git-credentials-*.config
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
          git remote remove origin || true
          if grep -rIil -e extraheader -e authorization -e includeif .git/config .git/config.worktree 2>/dev/null; then
            echo "refusing to ship a checkout that still authenticates" >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/source.tgz" --exclude=./.falconet -C . .
          echo "bytes=$(wc -c <"$RUNNER_TEMP/source.tgz")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.prepare.outputs.outcome == 'ready'
        with:
          name: source-gate
          path: ${{ runner.temp }}/source.tgz
          retention-days: 7
          # Not a hidden path, but the same rule: a hand-off that finds
          # nothing has failed, whatever the reason.
          if-no-files-found: error

  # =========================================================================
  # implement — judgment, and nothing else
  # =========================================================================
  #
  # No token, no secrets beyond the model key, no push. The agent edits
  # files, writes a commit message to a file, and stops. Issue text is
  # attacker-controlled AND it is this agent's instructions — "also edit the
  # workflow to grant Bash" is the attack, and the commit verb's path
  # allowlist is what refuses it.
  #
  # The scripted steps in this job are fine, and so is a harness with a
  # shell: the JOB has no token, so nothing here can publish. That is the
  # distinction the boundary is drawn on. What a harness with a shell CAN
  # reach is the model key, which is why the shipped default grants none.
  implement:
    needs: gate
    if: needs.gate.outputs.outcome == 'ready'
    runs-on: ${{ inputs.runs-on }}
    # However many passes max-attempts allows, this is the bound on the job
    # as a whole; the default harness caps each pass at 40 turns.
    timeout-minutes: 60
    permissions: {}
    outputs:
      outcome: ${{ steps.commit.outputs.outcome }}
      # The word of the LAST check that ran. `fail` here means the cap was
      # reached with the check still failing, and publish hands off instead
      # of opening a pull request.
      check: ${{ steps.loop.outputs.check }}
    steps:
      # NO checkout in this job, ever — contract.test.sh holds it. The
      # repository being worked on cannot be cloned here (see gate's
      # hand-over step), and falconet arrives without one: the action runs
      # from the runner's action cache, and what it fetches is this public
      # module through the module proxy, with no token.
      - name: Install falconet and gitleaks
        uses: zetlen/falconet@v1.1.2 # x-release-please-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-gate
          path: ${{ runner.temp }}/source

      - name: Take the checkout the gate prepared
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/source/source.tgz" -C .
          git rev-parse --is-inside-work-tree >/dev/null \
            || { echo "the shipped source is not a git repository" >&2; exit 1; }
          # Fail closed rather than run the agent against a tree that is not
          # the one the gate planned: every guard downstream compares against
          # this commit.
          test "$(git rev-parse HEAD)" = "$BASE_SHA" \
            || { echo "shipped HEAD is not the base the gate recorded" >&2; exit 1; }
          # The clone that arrived has no remote — that is the point — so
          # there is nothing here to push to even if something tried.
          test -z "$(git remote)" \
            || { echo "the shipped checkout still has a remote" >&2; exit 1; }
        env:
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}

      # As in gate: commit reads `git status --untracked-files=all`, and the
      # handoff it is about to download is the one untracked path that is not
      # the agent's. The shipped .git already carries this line; written again
      # because a checkout that stops being tarred with its .git would
      # otherwise take the exclusion with it silently.
      - name: Keep the handoff out of the working tree
        run: |
          mkdir -p .git/info
          printf '%s\n' .falconet/ >> .git/info/exclude

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: handoff-gate
          path: .falconet

      # prepare already opened this branch, and the tar carries it. The
      # fallback is for a handover that ever arrives detached; the identity is
      # set here because the commit is made here.
      - name: Take the working branch
        run: |
          set -euo pipefail
          git switch -q "$BRANCH" 2>/dev/null || git switch -qc "$BRANCH"
          git config user.name  "falconet[bot]"
          git config user.email "falconet[bot]@users.noreply.github.com"
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}

      # The harness is whatever the caller's snippet installs. It runs as a
      # template expression in a run: block, which is fine for exactly one
      # reason: the snippet is the caller's own workflow file, written by a
      # person, and nothing attacker-controlled reaches it. Nothing else in
      # this workflow is interpolated that way.
      - name: Install the harness
        run: ${{ inputs.harness-setup }}

      # The loop. `falconet implement` runs harness.command once with the
      # prompt on its stdin; `falconet check` runs the repository's own
      # check on what it left and says one word. A `fail` before the cap is
      # another pass, in a fresh agent context, with check-failure.txt in
      # the handoff directory; anything else ends the loop, and the word
      # is this job's output. Under `set -e` an implement that could not
      # run its harness, or a check that could not run its command, is a
      # red step here, before the commit: a pass that did not happen is not
      # a pass.
      #
      # The model key enters this job here and nowhere else, under the name
      # the caller said the harness reads. It is the only secret this job
      # holds, and the only credential a harness with a shell could reach.
      - name: Implement, and check, until the check passes or the cap
        id: loop
        env:
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          MODEL_API_KEY_ENV: ${{ inputs.model-api-key-env }}
          MODEL_API_KEY: ${{ secrets.model-api-key }}
          FALCONET_CONFIG_FLAG: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}
        run: |
          set -euo pipefail
          export "$MODEL_API_KEY_ENV=$MODEL_API_KEY"
          unset MODEL_API_KEY
          attempt=0
          word=skipped
          while :; do
            attempt=$((attempt + 1))
            echo "::group::Agent pass $attempt of $MAX_ATTEMPTS"
            # shellcheck disable=SC2086
            falconet implement $FALCONET_CONFIG_FLAG
            echo "::endgroup::"
            # shellcheck disable=SC2086
            word="$(falconet check $FALCONET_CONFIG_FLAG)"
            [ "$word" = fail ] && [ "$attempt" -lt "$MAX_ATTEMPTS" ] || break
          done
          echo "check=$word" >> "$GITHUB_OUTPUT"

      # Every guard rides here: the checkout's own git machinery (a
      # .git/config, hook or attributes file that would run a program is
      # refused before any git runs), the path allowlist, the content
      # denylist, the secret scan over the agent's drafts and then over the
      # staged change, and a vetted-path-only `git add`. Every git command
      # this job runs is hardened besides (internal/gitsafe). A refusal beats
      # a question: a
      # denied run commits nothing, so there is no committed work for
      # needs-info's ordering to protect. Unconditional on the check's
      # word: at the cap the guard-clean work is committed and pushed
      # anyway, so nothing is lost, and publish hands it off rather than
      # opening a pull request.
      #
      # `setup: false` claims an earlier step in THIS job installed the
      # binaries, and a job is a fresh runner: the install is this job's
      # first step. commit needs gitleaks, and the secret scan fails closed
      # on a missing scanner.
      - name: Commit
        id: commit
        uses: zetlen/falconet@v1.1.2 # x-release-please-version
        with:
          verb: commit
          setup: 'false'
          args: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}

      # Before this job ends, so the work outlives the runner. See the header.
      #
      # Written INTO the handoff directory, not beside it. An upload naming
      # two paths is rooted at their least common ancestor — here
      # `/home/runner/work` — so the archive would arrive as
      # `<repo>/<repo>/.falconet/…` and publish's download of `.falconet`
      # would match nothing. One path, one root.
      - name: Bundle the work
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .falconet
          git bundle create .falconet/branch.bundle \
            "${{ needs.gate.outputs.base_sha }}..HEAD" 2>/dev/null \
            || : >.falconet/branch.bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: handoff-implement
          path: .falconet/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # =========================================================================
  # publish — the push first, then everything that depends on it
  # =========================================================================
  publish:
    needs: [gate, implement]
    if: always() && needs.implement.result != 'skipped'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 1
          token: ${{ steps.token.outputs.token }}

      # As in gate. No verb in this job reads `git status`; the exclusion is
      # written the same way in every job, so a verb that starts to is
      # already covered.
      - name: Keep the handoff out of the working tree
        run: |
          mkdir -p .git/info
          printf '%s\n' .falconet/ >> .git/info/exclude

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: handoff-implement
          path: .falconet

      - name: Restore the branch
        run: |
          set -euo pipefail
          # Fail closed. Every file the rest of this job reads — the commit
          # body, the subject, the request — came out of that artifact, and a
          # download that quietly matched nothing would be a pushed branch
          # and a pull request that cannot be assembled.
          test -f .falconet/branch.bundle \
            || { echo "the implement hand-off carried no bundle" >&2; exit 1; }
          git switch -c "$BRANCH"
          if [ -s .falconet/branch.bundle ]; then
            git fetch .falconet/branch.bundle HEAD
            git reset --hard FETCH_HEAD
          fi
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}

      # The one step between the branch and the remote: the push needs the
      # binary, and the binary is a download. It is the only thing that runs
      # before the push, and the work is durable as an artifact throughout.
      - name: Install falconet and gitleaks
        uses: zetlen/falconet@v1.1.2 # x-release-please-version

      # Unconditional, and the first verb. Every run leaves its branch on the
      # remote, so a stale branch is ordinary and the collision rename does
      # the bookkeeping. Nothing below runs before the work is somewhere
      # durable.
      - name: Push
        uses: zetlen/falconet@v1.1.2 # x-release-please-version
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          verb: push
          setup: 'false'
          args: --branch ${{ needs.gate.outputs.branch }} --base-sha ${{ needs.gate.outputs.base_sha }}

      # The body is the commit body and a "Closes" line, and nothing else.
      # The evidence a reviewer reads is posted on the pull request by the
      # repository's own checks, from credentials this workflow never holds —
      # so a run that pushed a commit always reaches this step, and what a
      # person is asked to look at is the change plus whatever those checks
      # say about it.
      - name: Assemble the pull-request body
        if: needs.implement.outputs.outcome == 'success' && needs.implement.outputs.check != 'fail'
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          { cat .falconet/commit-body.md; printf '\n\nCloses #%s\n' "$ISSUE"; } > .falconet/pr.md

      # The title comes from the commit subject the agent wrote, never from
      # the issue title. The agent's account of its own change is the thing a
      # human reviews it against.
      #
      # The label comes from the same config every verb reads, through the
      # binary, so this step cannot drift from what prepare resolved.
      # $FALCONET_CONFIG_FLAG is the `--config FILE` the verb steps build
      # from inputs.config, or nothing; unquoted so that nothing is no
      # argument. Captured in its own assignment, so a config the binary
      # refuses fails this step here and loudly, not inside gh's argument
      # list.
      - name: Open the pull request
        if: needs.implement.outputs.outcome == 'success' && needs.implement.outputs.check != 'fail'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          FALCONET_CONFIG_FLAG: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          label="$(falconet config $FALCONET_CONFIG_FLAG get .labels.pr)"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$PUSHED_BRANCH" \
            --title "$(cat .falconet/commit-subject.txt)" \
            --body-file .falconet/pr.md \
            --label "$label"

      # The four hand-overs are `run:` steps, not calls through the action,
      # because the action splits `args` on whitespace — by design, and its
      # own comment says why — and a preamble is a sentence. Through the
      # action, `--preamble "Before I can …"` arrives as `--preamble`,
      # `"Before`, `I`, … and pause refuses the second word as an unknown
      # argument. The shell's own quoting is what a sentence needs, and the
      # binary is on PATH. Every argument that is not a literal comes through
      # `env:`, never a template expression inside the block; the branch is
      # $PUSHED_BRANCH, which the push verb set — the branch that IS on the
      # remote, not the one prepare intended. When nothing was pushed it is
      # UNSET, not empty (push writes $GITHUB_ENV only when a push landed),
      # and the hand-overs for a question and for a failure are exactly the
      # paths with nothing to push; under `set -u` a bare "$PUSHED_BRANCH"
      # kills the step before pause runs — the agent's question never reaches
      # the issue, and contain pauses it under the wrong label.
      # `${PUSHED_BRANCH:-}` passes the empty string, which pause accepts as
      # "no branch".
      - name: Hand over — the agent asked a question
        if: needs.implement.outputs.outcome == 'needs-info'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          falconet pause \
            --issue "$ISSUE" \
            --label needs-info \
            --branch "${PUSHED_BRANCH:-}" \
            --body .falconet/needs-info.md \
            --run-url "$RUN_URL" \
            --preamble "Before I can prepare this change I need a bit more from you:"

      # The cap: the agent's guard-clean work is committed and on the
      # remote, and the repository's own check still fails on it. Not a
      # pull request — a pull request nothing passes is a reviewer's time
      # spent on a change its author's own check refused — but not lost
      # either: the branch is named and linked, and the check's output is
      # the body, fenced and collapsed, because it is machine output.
      - name: Hand over — the check failed at the cap
        if: needs.implement.outputs.outcome == 'success' && needs.implement.outputs.check == 'fail'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          falconet pause \
            --issue "$ISSUE" \
            --label ready-for-human \
            --branch "${PUSHED_BRANCH:-}" \
            --body .falconet/check-failure.txt \
            --body-title "What the check said" \
            --run-url "$RUN_URL" \
            --preamble "I prepared this change and pushed it, but the repository's own check fails on it and I could not get it passing in the attempts I'm allowed. This one needs a person."

      - name: Hand over — the run could not prepare a change
        if: needs.implement.outputs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          falconet pause \
            --issue "$ISSUE" \
            --label ready-for-human \
            --branch "${PUSHED_BRANCH:-}" \
            --body .falconet/failure-reason.txt \
            --run-url "$RUN_URL" \
            --preamble "I wasn't able to prepare this change automatically. This one needs a person."

  # =========================================================================
  # contain — a request never disappears into a green run that produced nothing
  # =========================================================================
  contain:
    needs: [gate, implement, publish]
    if: always() && needs.gate.outputs.outcome == 'ready'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1 }

      - name: Install falconet and gitleaks
        uses: zetlen/falconet@v1.1.2 # x-release-please-version

      # Terminal state, or pause. Closed, already paused, or an open PR across
      # either branch prefix all count as terminal; anything else gets a
      # comment with a link to this run, because a request that vanishes into
      # an empty green run is the failure this pipeline cares about most.
      #
      # Every answer is CAPTURED into a variable and then inspected — never
      # `gh … | grep -q` (AGENTS.md): grep -q exits at the first match and
      # can SIGPIPE gh, which under pipefail turns a FOUND match into a failed
      # pipeline, the exact opposite of the answer just computed. gh's own
      # --template does the reading, so no JSON tool is needed on the runner.
      # A gh that fails is a red step here, not "closed — terminal": an
      # answer nobody got is not an answer.
      - name: Ensure a terminal state
        id: check
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          state="$(gh issue view "$ISSUE" --json state --template '{{.state}}')"
          if [ "$state" != OPEN ]; then
            echo "issue #$ISSUE is closed — terminal"
            echo "terminal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels="$(gh issue view "$ISSUE" --json labels \
            --template '{{range .labels}}{{.name}}{{"\n"}}{{end}}')"
          if grep -qxE 'needs-info|ready-for-human' <<<"$labels"; then
            echo "issue #$ISSUE is already paused — terminal"
            echo "terminal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heads="$(gh pr list --state open --json number,headRefName \
            --template '{{range .}}{{.headRefName}}{{"\n"}}{{end}}')"
          if grep -qE "^(claude/)?issue-${ISSUE}-" <<<"$heads"; then
            echo "issue #$ISSUE has an open PR — terminal"
            echo "terminal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "issue #$ISSUE is open, unpaused and has no pull request — pausing it"
          echo "terminal=false" >> "$GITHUB_OUTPUT"

      # A `run:` step for the publish job's reason: the preamble is a
      # sentence, and the action splits args on whitespace. No branch — this
      # job does not know whether one was pushed, and a wrong link is worse
      # than none — so --branch is the empty string, which pause accepts.
      # `!cancelled()` and not `always()`: a check that FAILED — gh could not
      # read the issue — leaves `terminal` unset, and this runs. The issue
      # may turn out to be closed, and a comment lands on a closed issue; the
      # alternative is a red step in the Actions tab and nothing on the
      # issue, which is the silence this job exists to prevent. The one
      # thing that must not pause is a cancelled run, which a person chose.
      - name: Pause the issue, so this run is not its last word
        if: "!cancelled() && steps.check.outputs.terminal != 'true'"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          falconet pause \
            --issue "$ISSUE" \
            --label ready-for-human \
            --branch "" \
            --run-url "$RUN_URL" \
            --preamble "This run stopped before it reached a conclusion, so nobody has been told anything useful. This one needs a person."
