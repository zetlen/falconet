# falconet — the documented job graph.
#
# gate → implement → publish → contain. Four jobs, and the boundaries between
# them are the security model rather than a tidy diagram:
#
#   the AGENT JOB never holds a token. Not a blanked one — none. The origin
#   blanked credentials on the agent STEP and said so honestly in its own
#   comment: whether a `uses:` step's env: reaches a composite action's
#   expression context is not something it had confirmed on a live run. A job
#   with `permissions: {}` and no secrets: block is not best-effort.
#
#   the SCRIPTED JOBS never run the agent. They hold the token and do the
#   mechanics — the branch, the guards, the commit, the push, the plan, the
#   pull request — none of which is judgment and none of which an agent
#   should be able to skip, improvise, or be argued out of.
#
# ---------------------------------------------------------------------------
# The cost of that boundary, stated plainly
# ---------------------------------------------------------------------------
# Run 32093607680 taught this pipeline to push the moment a commit exists,
# because the only push used to sit behind an approved review and every other
# exit left the work on a runner that was destroyed minutes later. The issue
# was parked with a comment promising a prepared change that no longer existed
# anywhere.
#
# A job boundary between the commit and the push reopens a window in that
# guard — a smaller one, but a real one. Two things close it:
#
#   1. `implement` uploads a git BUNDLE of the branch before it ends. The
#      bundle outlives the runner, so the work is durable the instant it
#      exists, which is what the incident was actually about.
#   2. `publish`'s first step is the push. Nothing is validated, assembled or
#      posted before the branch is on the remote.
#
# So the work is never lost; there is a window of one job hand-off in which it
# is durable as an artifact rather than as a branch. `contain` links the run —
# and therefore the artifact — on every path that stops early.
#
# If that trade is wrong, the alternative is the origin's shape: one job,
# per-step credential blanking, and the honesty that step-level blanking is
# unconfirmed. This file takes the enforceable boundary and pays for it here.

name: falconet

on:
  workflow_call:
    inputs:
      issue:
        description: 'The issue number to work.'
        required: true
        type: number
      config:
        description: 'Path to falconet.json, if not .github/falconet.json.'
        required: false
        type: string
        default: ''
      falconet-ref:
        description: 'Which falconet to run.'
        required: false
        type: string
        default: main
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      app-id:
        description: >-
          A GitHub App registered purely as a credential — no webhook, nothing
          hosted. Output is authored by the app rather than by a person, and
          App-token pushes fire pull_request events, which GITHUB_TOKEN
          pushes do not. That is why the empty-commit-with-a-PAT workaround
          is deleted rather than ported.
        required: true
      app-private-key:
        required: true
      anthropic-api-key:
        description: >-
          Deliberately an API key, not a subscription token, so falconet's
          spend stays a separate number.
        required: true
      plan-env:
        description: >-
          A JSON object of environment variables the stacks need in order to
          init and plan — state backend keys, provider tokens, TF_VAR_*. For
          example: {"AWS_ACCESS_KEY_ID": "...", "AWS_SECRET_ACCESS_KEY": "...",
          "CLOUDFLARE_API_TOKEN": "..."}. One secret rather than a named input
          per cloud, because a backend is an S3 key here and a service account
          there. Omit it if the stacks plan without credentials.
        required: false

permissions: {}

jobs:
  # =========================================================================
  # gate — is this issue ours, and if so lay out the work
  # =========================================================================
  gate:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      outcome:   ${{ steps.prepare.outputs.outcome }}
      branch:    ${{ steps.read.outputs.branch }}
      base_sha:  ${{ steps.read.outputs.base_sha }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ steps.token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: zetlen/falconet
          ref: ${{ inputs.falconet-ref }}
          path: .falconet-tool

      # The tool is checked out INSIDE the repository it works on -- a
      # composite action can only run from under the workspace -- and the
      # handoff directory is written there too. Both are untracked paths in
      # the consumer's tree, and two verbs read `git status`: prepare refuses
      # a dirty tree, commit refuses any changed path outside the allowlist.
      # Without this step every run died right here, on `?? .falconet-tool/`,
      # before the acknowledgment, so the requester heard nothing at all.
      #
      # Per clone and never committed. A consumer still gitignores the
      # handoff directory for runs by hand; a run in CI must not depend on it.
      - name: Keep the tool and the handoff out of the working tree
        run: |
          mkdir -p .git/info
          printf '%s\n' .falconet-tool/ .falconet/ >> .git/info/exclude

      # Eligibility is decided here and not in a job-level `if:`, because an
      # `if:` evaluates before checkout and can therefore never read the
      # config file. Gating there would fork eligibility into YAML-in-CI and
      # nothing-locally, for a project whose whole rule is one code path. The
      # cost is runner-seconds on ineligible events.
      # One secret, masked and turned into ordinary environment variables, so
      # that tofu sees what it would see on a workstation and no verb has to
      # know the name of a cloud.
      #
      # Loaded in the two jobs that run tofu and NOWHERE ELSE. The agent job
      # has permissions: {} and no token; a cloud credential in its
      # environment would undo that, because the boundary is that judgment
      # runs where publishing cannot. It sits as late in the job as it can,
      # so the steps that do not need it do not have it.
      - name: Credentials for the stacks that plan
        env:
          FALCONET_PLAN_ENV: ${{ secrets.plan-env }}
        run: |
          set -euo pipefail
          if [ -z "${FALCONET_PLAN_ENV:-}" ]; then
            echo "no plan-env secret: the stacks must init and plan without one"
            exit 0
          fi
          printf '%s' "$FALCONET_PLAN_ENV" | jq -e 'type == "object"' >/dev/null 2>&1 \
            || { echo "plan-env must be a JSON object of NAME: value" >&2; exit 1; }
          while IFS= read -r name; do
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
              || { echo "plan-env: '$name' is not an environment variable name" >&2; exit 1; }
            value="$(printf '%s' "$FALCONET_PLAN_ENV" | jq -r --arg k "$name" '.[$k]')"
            case "$value" in
              *FALCONET_PLAN_ENV_EOF*)
                echo "plan-env: the value of $name contains the delimiter" >&2; exit 1 ;;
            esac
            # add-mask is per line, and a PEM is many lines.
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<<"$value"
            printf '%s<<FALCONET_PLAN_ENV_EOF\n%s\nFALCONET_PLAN_ENV_EOF\n' \
              "$name" "$value" >>"$GITHUB_ENV"
            echo "plan-env: set $name"
          done < <(printf '%s' "$FALCONET_PLAN_ENV" | jq -r 'keys_unsorted[]')

      - name: Prepare
        id: prepare
        uses: ./.falconet-tool
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FALCONET_EVENT_PATH: ${{ github.event_path }}
        with:
          verb: prepare
          args: --issue ${{ inputs.issue }} ${{ inputs.config && format('--config {0}', inputs.config) || '' }}

      - name: Read the handoff
        id: read
        if: steps.prepare.outputs.outcome == 'ready'
        run: |
          set -euo pipefail
          echo "branch=$(cat .falconet/branch.txt)"     >> "$GITHUB_OUTPUT"
          echo "base_sha=$(cat .falconet/base-sha.txt)" >> "$GITHUB_OUTPUT"

      # `include-hidden-files`, because the handoff directory's name starts
      # with a dot and upload-artifact@v4 excludes hidden paths by DEFAULT. It
      # does it as a warning — "No files were found with the provided path" —
      # and the step still goes green, so gate uploaded nothing while
      # reporting success and implement died two jobs later on an artifact
      # that had never existed. `if-no-files-found: error` is the other half:
      # this hand-off is not optional, and a step that finds nothing here has
      # failed whatever the reason.
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.outcome == 'ready'
        with:
          name: handoff-gate
          path: .falconet/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

      # The agent job cannot check the repository out for itself: it holds no
      # token, and a private repository answers a tokenless clone with
      # "Repository not found". The first consumer's first canary died exactly
      # there. So gate — which has a token and has already used it — hands the
      # checkout over as an artifact, and the boundary stays what it says it
      # is rather than being traded away for a clone.
      #
      # A TARBALL OF THE CHECKOUT, not a bundle. `git bundle create` from a
      # depth-1 clone exits 0 and `git bundle verify` calls the result "a
      # complete history"; cloning it then fails on the first traversal —
      # `error: Could not read <parent>` — because the tip's parent was never
      # fetched and nothing marks the clone shallow. A tar of the working tree
      # WITH its `.git` arrives as precisely the shallow clone gate had, which
      # is what `actions/checkout` would have produced anyway. (The range
      # bundle from implement to publish is a different thing and is sound:
      # both ends already hold the base commit, so the bundle records it as a
      # prerequisite instead of pretending to carry it.)
      #
      # The credential comes out FIRST. checkout persists it into .git/config
      # as an extraheader, prepare needs it while it is running — `git
      # ls-remote origin` is how the in-flight branch check sees the remote —
      # and by this step prepare is finished with it. Shipping it would hand
      # the agent job a push-capable token inside a directory it can read,
      # which is the one thing this whole job graph is built to prevent. The
      # grep is the fail-closed half: if a future checkout writes the
      # credential somewhere else in .git, nothing ships at all.
      - name: Hand the checkout to the agent job, without the credential
        id: source
        if: steps.prepare.outputs.outcome == 'ready'
        run: |
          set -euo pipefail
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
          git remote remove origin || true
          if grep -rIl -e extraheader -e AUTHORIZATION .git/config .git/config.worktree 2>/dev/null; then
            echo "refusing to ship a checkout that still authenticates" >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/source.tgz" \
            --exclude=./.falconet-tool --exclude=./.falconet -C . .
          echo "bytes=$(wc -c <"$RUNNER_TEMP/source.tgz")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.outcome == 'ready'
        with:
          name: source-gate
          path: ${{ runner.temp }}/source.tgz
          retention-days: 7
          # Not a hidden path, but the same rule: a hand-off that finds
          # nothing has failed, whatever the reason.
          if-no-files-found: error

  # =========================================================================
  # implement — judgment, and nothing else
  # =========================================================================
  #
  # No token, no secrets beyond the model key, no push. The agent's grant is
  # exactly Read,Edit,Write,Grep,Glob: it edits files, writes a commit message
  # to a file, and stops. Issue text is attacker-controlled AND it is this
  # agent's instructions — "also edit the workflow to grant Bash" is the
  # attack, and the commit verb's path allowlist is what refuses it.
  #
  # The scripted steps in this job are fine: the JOB has no token, so nothing
  # here can publish. That is the distinction the boundary is drawn on.
  implement:
    needs: gate
    if: needs.gate.outputs.outcome == 'ready'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions: {}
    outputs:
      outcome: ${{ steps.commit.outputs.outcome }}
    steps:
      # falconet itself is public, so this clone needs no permission. The
      # repository being worked on is the one that cannot be cloned from here
      # — see gate's hand-over step.
      - uses: actions/checkout@v4
        with:
          repository: zetlen/falconet
          ref: ${{ inputs.falconet-ref }}
          path: .falconet-tool
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: source-gate
          path: ${{ runner.temp }}/source

      - name: Take the checkout the gate prepared
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/source/source.tgz" -C .
          git rev-parse --is-inside-work-tree >/dev/null \
            || { echo "the shipped source is not a git repository" >&2; exit 1; }
          # Fail closed rather than run the agent against a tree that is not
          # the one the gate planned: every guard downstream compares against
          # this commit.
          test "$(git rev-parse HEAD)" = "$BASE_SHA" \
            || { echo "shipped HEAD is not the base the gate recorded" >&2; exit 1; }
          # The clone that arrived has no remote — that is the point — so
          # there is nothing here to push to even if something tried.
          test -z "$(git remote)" \
            || { echo "the shipped checkout still has a remote" >&2; exit 1; }
        env:
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}

      # As in gate: commit reads `git status --untracked-files=all`, and the
      # tool and the handoff it is about to download are the two untracked
      # paths that are not the agent's. The shipped .git already carries these
      # lines; written again because a checkout that stops being tarred with
      # its .git would otherwise take the exclusion with it silently.
      - name: Keep the tool and the handoff out of the working tree
        run: |
          mkdir -p .git/info
          printf '%s\n' .falconet-tool/ .falconet/ >> .git/info/exclude

      - uses: actions/download-artifact@v4
        with:
          name: handoff-gate
          path: .falconet

      # prepare already opened this branch, and the tar carries it. The
      # fallback is for a handover that ever arrives detached; the identity is
      # set here because the commit is made here.
      - name: Take the working branch
        run: |
          set -euo pipefail
          git switch -q "$BRANCH" 2>/dev/null || git switch -qc "$BRANCH"
          git config user.name  "falconet[bot]"
          git config user.email "falconet[bot]@users.noreply.github.com"
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}

      - name: Resolve the prompt
        id: prompt
        run: |
          set -euo pipefail
          {
            echo 'text<<FALCONET_PROMPT_EOF'
            ./.falconet-tool/bin/falconet prompt implement
            echo FALCONET_PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      # `github_token` is here to keep `permissions: {}` true. Given no token,
      # the action mints one for itself by exchanging a GitHub OIDC token —
      # which needs `id-token: write`, a permission this job refuses to hold:
      # without it the run dies with "Could not fetch an OIDC token".
      #
      # So it is handed this job's own GITHUB_TOKEN, which in a job with no
      # permissions carries NO SCOPES AT ALL. It cannot read this repository,
      # let alone write to it. That is the distinction the boundary is drawn
      # on: not whether a variable called a token exists in the environment,
      # but whether anything in this job can publish. The App token — the one
      # that can — is minted in gate, publish and contain, and is never
      # passed here.
      - name: Implement the change
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.anthropic-api-key }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --allowedTools "Read,Edit,Write,Grep,Glob"
            --max-turns 40

      # Every guard rides here: the path allowlist, the content denylist, the
      # secret scan over the agent's drafts and then over the staged change,
      # per-file formatting, and a vetted-path-only `git add`. A refusal beats
      # a question: a denied run commits nothing, so there is no committed
      # work for needs-info's ordering to protect.
      # `setup: false` claims an earlier step in THIS job installed the
      # binaries, and a job is a fresh runner. commit needs `tofu fmt` and
      # gitleaks, and the secret scan fails closed on a missing scanner, so
      # this is the step that installs them.
      - name: Commit
        id: commit
        uses: ./.falconet-tool
        with:
          verb: commit
          args: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}

      # Before this job ends, so the work outlives the runner. See the header.
      #
      # Written INTO the handoff directory, not beside it. An upload naming
      # two paths is rooted at their least common ancestor — here
      # `/home/runner/work` — so the archive arrived as
      # `wayfinders-infra/wayfinders-infra/.falconet/…`, publish's copy of
      # `incoming/.falconet/` matched nothing, and the `|| true` on it turned
      # that into silence. The pull request then failed to assemble for want
      # of a file that had been uploaded all along. One path, one root.
      - name: Bundle the work
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .falconet
          git bundle create .falconet/branch.bundle \
            "${{ needs.gate.outputs.base_sha }}..HEAD" 2>/dev/null \
            || : >.falconet/branch.bundle

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-implement
          path: .falconet/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # =========================================================================
  # publish — the push first, then everything that depends on it
  # =========================================================================
  publish:
    needs: [gate, implement]
    if: always() && needs.implement.result != 'skipped'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 1
          token: ${{ steps.token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: zetlen/falconet
          ref: ${{ inputs.falconet-ref }}
          path: .falconet-tool

      # As in gate. No verb here reads `git status` today; kept uniform so
      # that the next one that does is not the next incident.
      - name: Keep the tool and the handoff out of the working tree
        run: |
          mkdir -p .git/info
          printf '%s\n' .falconet-tool/ .falconet/ >> .git/info/exclude

      - uses: actions/download-artifact@v4
        with:
          name: handoff-implement
          path: .falconet

      - name: Restore the branch
        run: |
          set -euo pipefail
          # Fail closed. Every file the rest of this job reads — the commit
          # body, the plan, the request — came out of that artifact, and a
          # copy that quietly matched nothing is how a pushed branch turned
          # into a pull request that could not be assembled.
          test -f .falconet/branch.bundle \
            || { echo "the implement hand-off carried no bundle" >&2; exit 1; }
          git switch -c "$BRANCH"
          if [ -s .falconet/branch.bundle ]; then
            git fetch .falconet/branch.bundle HEAD
            git reset --hard FETCH_HEAD
          fi
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}

      # Unconditional, and first. Every run leaves its branch on the remote,
      # so a stale branch is ordinary and the collision rename does the
      # bookkeeping. Nothing below runs before the work is somewhere durable.
      - name: Push
        uses: ./.falconet-tool
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          verb: push
          setup: 'false'
          args: --branch ${{ needs.gate.outputs.branch }} --base-sha ${{ needs.gate.outputs.base_sha }}

      # As in gate, and after the push for the same reason it is late there:
      # the branch is already on the remote before this job holds a cloud
      # credential at all.
      - name: Credentials for the stacks that plan
        env:
          FALCONET_PLAN_ENV: ${{ secrets.plan-env }}
        run: |
          set -euo pipefail
          if [ -z "${FALCONET_PLAN_ENV:-}" ]; then
            echo "no plan-env secret: the stacks must init and plan without one"
            exit 0
          fi
          printf '%s' "$FALCONET_PLAN_ENV" | jq -e 'type == "object"' >/dev/null 2>&1 \
            || { echo "plan-env must be a JSON object of NAME: value" >&2; exit 1; }
          while IFS= read -r name; do
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
              || { echo "plan-env: '$name' is not an environment variable name" >&2; exit 1; }
            value="$(printf '%s' "$FALCONET_PLAN_ENV" | jq -r --arg k "$name" '.[$k]')"
            case "$value" in
              *FALCONET_PLAN_ENV_EOF*)
                echo "plan-env: the value of $name contains the delimiter" >&2; exit 1 ;;
            esac
            # add-mask is per line, and a PEM is many lines.
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<<"$value"
            printf '%s<<FALCONET_PLAN_ENV_EOF\n%s\nFALCONET_PLAN_ENV_EOF\n' \
              "$name" "$value" >>"$GITHUB_ENV"
            echo "plan-env: set $name"
          done < <(printf '%s' "$FALCONET_PLAN_ENV" | jq -r 'keys_unsorted[]')

      - name: Validate
        id: validate
        if: needs.implement.outputs.outcome == 'success'
        continue-on-error: true
        uses: ./.falconet-tool
        with:
          verb: validate
          args: --base ${{ needs.gate.outputs.base_sha }} ${{ inputs.config && format('--config {0}', inputs.config) || '' }}

      - uses: actions/upload-artifact@v4
        if: needs.implement.outputs.outcome == 'success'
        with:
          name: tofu-plan-issue-${{ inputs.issue }}
          path: .falconet/plan.txt
          retention-days: 30
          # Hidden path, as above. `ignore` stays: a run that paused before it
          # planned has no plan to keep, and that is not a failure.
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Assemble the pull-request body
        if: needs.implement.outputs.outcome == 'success' && steps.validate.outcome == 'success'
        uses: ./.falconet-tool
        with:
          verb: assemble
          setup: 'false'
          args: >-
            --body .falconet/commit-body.md
            --plan .falconet/plan.txt
            --issue ${{ inputs.issue }}
            --out .falconet/pr.md
            --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # The title comes from the commit subject the agent wrote, never from
      # the issue title. The agent's account of its own change is the thing a
      # human reviews it against.
      - name: Open the pull request
        if: needs.implement.outputs.outcome == 'success' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$PUSHED_BRANCH" \
            --title "$(cat .falconet/commit-subject.txt)" \
            --body-file .falconet/pr.md \
            --label "$(jq -r '.labels.pr // "needs-plan-review"' \
                       "${FALCONET_CONFIG:-.github/falconet.json}" 2>/dev/null \
                       || echo needs-plan-review)"

      - name: Hand over — the agent asked a question
        if: needs.implement.outputs.outcome == 'needs-info'
        uses: ./.falconet-tool
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          verb: pause
          setup: 'false'
          args: >-
            --issue ${{ inputs.issue }}
            --label needs-info
            --branch ${{ env.PUSHED_BRANCH }}
            --body .falconet/needs-info.md
            --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --preamble "Before I can prepare this change I need a bit more from you:"

      - name: Hand over — the run could not prepare a change
        if: needs.implement.outputs.outcome == 'failure'
        uses: ./.falconet-tool
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          verb: pause
          setup: 'false'
          args: >-
            --issue ${{ inputs.issue }}
            --label ready-for-human
            --branch ${{ env.PUSHED_BRANCH }}
            --body .falconet/failure-reason.txt
            --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --preamble "I wasn't able to prepare this change automatically. This one needs a person."

      - name: Hand over — validation failed
        if: needs.implement.outputs.outcome == 'success' && steps.validate.outcome == 'failure'
        uses: ./.falconet-tool
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          verb: pause
          setup: 'false'
          args: >-
            --issue ${{ inputs.issue }}
            --label ready-for-human
            --branch ${{ env.PUSHED_BRANCH }}
            --body .falconet/validation-failure.txt
            --body-title "validation output"
            --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --preamble "I prepared this change, but it did not validate. This one needs a person."

  # =========================================================================
  # contain — a request never disappears into a green run that produced nothing
  # =========================================================================
  contain:
    needs: [gate, implement, publish]
    if: always() && needs.gate.outputs.outcome == 'ready'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/checkout@v4
        with:
          repository: zetlen/falconet
          ref: ${{ inputs.falconet-ref }}
          path: .falconet-tool

      # Terminal state, or pause. Closed, already paused, or an open PR across
      # either branch prefix all count as terminal; anything else gets a
      # comment with a link to this run, because a request that vanishes into
      # an empty green run is the failure this pipeline cares about most.
      - name: Ensure a terminal state
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          state="$(gh issue view "$ISSUE" --json state,labels)"
          if [ "$(jq -r .state <<<"$state")" != OPEN ]; then
            echo "issue #$ISSUE is closed — terminal"; exit 0
          fi
          if jq -r '.labels[].name' <<<"$state" \
               | grep -qxE 'needs-info|ready-for-human'; then
            echo "issue #$ISSUE is already paused — terminal"; exit 0
          fi
          heads="$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^(claude/)?issue-" + env.ISSUE + "-")) | .number')"
          if [ -n "$heads" ]; then
            echo "issue #$ISSUE has an open PR — terminal"; exit 0
          fi
          ./.falconet-tool/bin/falconet pause \
            --issue "$ISSUE" \
            --label ready-for-human \
            --branch "" \
            --run-url "$RUN_URL" \
            --preamble "This run stopped before it reached a conclusion, so nobody has been told anything useful. This one needs a person."
