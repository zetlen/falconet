name: falconet
description: >-
  Turn a request filed as an issue into a pull request a person can review,
  and stop there. This action is setup plus pass-through: it
  installs the binaries the verbs need — gitleaks, pinned by version and
  digest, and falconet itself, at the ref this action was called at — and
  then runs one verb, or runs nothing and leaves them on PATH.
author: zetlen

inputs:
  verb:
    description: >-
      One of prepare, check, commit, push, or the unlisted prompt. Not
      pause: `args` is split on whitespace and a pause preamble is a
      sentence, so it runs from PATH in the workflow's own run: steps.
      Empty means setup only: the binaries are installed and no verb runs,
      which is how a job puts falconet on PATH before its first verb.
    required: false
    default: ''
  args:
    description: >-
      Arguments for the verb, split on whitespace. NEVER pass issue text
      here — see the note in the run step. Files and environment variables
      are how attacker-controlled text travels.
    required: false
    default: ''
  working-directory:
    description: 'The repository the verb operates on. Defaults to the checkout.'
    required: false
    default: '.'
  setup:
    description: >-
      Install the binaries. Leave true on the first call in a job and set
      false afterwards; the installs are idempotent but not free.
    required: false
    default: 'true'
  gitleaks-version:
    description: 'Pinned gitleaks release.'
    required: false
    default: '8.30.1'
  gitleaks-sha256:
    description: >-
      SHA-256 of the linux_x64 asset. The version pins WHAT is fetched; this
      pins what arrives, because a tag is a mutable pointer and a release
      asset can be replaced. Bump the two together — if they disagree the
      step fails, and no scan is ever skipped silently.
    required: false
    default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

outputs:
  outcome:
    description: 'The one word the verb printed on stdout, for the verbs that print one.'
    value: ${{ steps.run.outputs.outcome }}

runs:
  using: composite
  steps:
    # The BINARY, not gitleaks/gitleaks-action: the action's licence
    # distinguishes individual users from organisations and asks the second
    # kind for a key, and falconet would rather ship something a person can
    # also run by hand.
    #
    # `gitleaks version` last: proof that what came out of the tarball
    # actually runs, on this runner, before anything depends on it. The scan
    # fails closed on a missing binary, so a broken install pauses the issue
    # rather than publishing unscanned text — but failing here is better than
    # failing there.
    - name: Install gitleaks (pinned)
      if: inputs.setup == 'true'
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
      run: |
        set -euo pipefail
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks version
          exit 0
        fi
        asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$url"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$RUNNER_TEMP/gitleaks" "$HOME/.local/bin/gitleaks"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/gitleaks" version

    # falconet itself comes from the ref the caller's `uses:` named, in one of
    # two ways.
    #
    # At a vX.Y.Z tag, on a runner that release publishes an asset for, the
    # job downloads that asset from this repository's release at that tag.
    # The release workflow builds the assets and publishes the release, and
    # immutable releases lock the tag and every asset at publish. The asset
    # is checked against the release's checksums.txt before it is unpacked.
    # The download needs no token, because the repository is public.
    #
    # At any other ref, a branch or a commit, there is no release, and the job
    # compiles: `go install` of this module at that ref. The module proxy
    # serves the source and the checksum database vouches for it. The same
    # holds on a runner with no asset. Go comes from setup-go, pinned by SHA,
    # reading the toolchain line of THIS action's go.mod, not the
    # workspace's, which is the consumer's repository and is not a Go module.
    # setup-go's cache is off for the same reason: it keys on a go.sum under
    # the workspace.
    #
    # The ref travels through `env:`, never through the run: block. Inside a
    # composite action `github.action_ref` is populated when a step's env is
    # evaluated and is EMPTY by the time its run: block is (actions/runner
    # #2473). An empty ref, which is what a `uses: ./` hands the action, is
    # refused outright. contract.test.sh holds the shape.
    - name: Choose how to install falconet
      id: how
      if: inputs.setup == 'true'
      shell: bash
      env:
        FALCONET_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        if [ -z "$FALCONET_REF" ]; then
          echo "no action ref: use this action as zetlen/falconet@<ref>, not from a local path" >&2
          exit 1
        fi
        # RUNNER_OS and RUNNER_ARCH name the runner; the platform is the
        # GOOS_GOARCH pair in the asset name, from the Makefile's PLATFORMS.
        platform=""
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux_amd64 ;;
          Linux/ARM64) platform=linux_arm64 ;;
          macOS/ARM64) platform=darwin_arm64 ;;
        esac
        asset=""
        if [[ "$FALCONET_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -n "$platform" ]; then
          asset="falconet_${FALCONET_REF#v}_${platform}.tar.gz"
        fi
        echo "asset=$asset" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: inputs.setup == 'true' && steps.how.outputs.asset == ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    # `falconet version` runs LAST and, when the ref is a tag, must report
    # that tag. A release asset carries the tag its build was stamped with,
    # and `go install` at a tag records the tag it resolved, so a binary that
    # calls itself anything else is not the one the ref names. Any other ref
    # resolves to a pseudo-version, and the proof is that it runs.
    # GITHUB_PATH prepends, so a falconet an earlier step left on PATH is
    # behind this one.
    - name: Install falconet
      if: inputs.setup == 'true'
      shell: bash
      env:
        FALCONET_REF: ${{ github.action_ref }}
        FALCONET_ASSET: ${{ steps.how.outputs.asset }}
        CGO_ENABLED: '0'
      run: |
        set -euo pipefail
        dest="$HOME/.local/bin"
        mkdir -p "$dest"
        if [ -n "$FALCONET_ASSET" ]; then
          base="https://github.com/zetlen/falconet/releases/download/$FALCONET_REF"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$FALCONET_ASSET" "$base/$FALCONET_ASSET"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/falconet-checksums.txt" "$base/checksums.txt"
          sum="$(awk -v a="$FALCONET_ASSET" '$2 == a' "$RUNNER_TEMP/falconet-checksums.txt")"
          if [ -z "$sum" ]; then
            echo "checksums.txt at $FALCONET_REF has no line for $FALCONET_ASSET" >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP" && printf '%s\n' "$sum" | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/$FALCONET_ASSET" -C "$RUNNER_TEMP" falconet
          install -m 0755 "$RUNNER_TEMP/falconet" "$dest/falconet"
        else
          GOBIN="$dest" go install "github.com/zetlen/falconet/cmd/falconet@$FALCONET_REF"
        fi
        echo "$dest" >> "$GITHUB_PATH"
        have="$("$dest/falconet" version)"
        case "$FALCONET_REF" in
          v[0-9]*)
            case "$have" in
              "falconet $FALCONET_REF "*) echo "$have" ;;
              *) echo "the installed falconet reports '$have', not $FALCONET_REF" >&2; exit 1 ;;
            esac ;;
          *) echo "$have" ;;
        esac

    # The verb and its arguments reach the shell through the ENVIRONMENT, not
    # through a template expression. That is not style: an issue title, body
    # or comment interpolated into a `run:` block is a shell injection with
    # the requester holding the keyboard, and the whole reason the verbs
    # take files rather than strings is so that text never has to travel this
    # way. $FALCONET_ARGS is deliberately unquoted so a caller can pass
    # several arguments — which is exactly why a caller must never put issue
    # text in it.
    #
    # Skipped when no verb was asked for: a call with an empty `verb` is an
    # install and nothing else, and `outcome` is then empty.
    - name: Run
      id: run
      if: inputs.verb != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FALCONET_VERB: ${{ inputs.verb }}
        FALCONET_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        # shellcheck disable=SC2086
        outcome="$(falconet "$FALCONET_VERB" $FALCONET_ARGS)"
        rc=$?
        printf '%s\n' "$outcome"
        # Written with a delimiter, not `name=value`. The verbs that decide
        # something print one word, but `push` once printed a sentence, and
        # `name=` with a newline in the value is "Invalid format" — a step
        # that had already done its work failing on the way out, taking the
        # pull request with it. The delimiter form is legal whatever a verb
        # prints, so no verb's stdout can break the step that ran it again.
        {
          echo "outcome<<FALCONET_OUTCOME_EOF"
          printf '%s\n' "$outcome"
          echo FALCONET_OUTCOME_EOF
        } >> "$GITHUB_OUTPUT"
        exit "$rc"
