name: falconet
description: >-
  Turn a plain-language infrastructure request into a pull request a person
  can review, and stop there. This action is setup plus pass-through: it pins
  the binaries the verbs need — gitleaks and falconet itself — and then runs
  one verb, or runs nothing and leaves them on PATH.
author: zetlen

inputs:
  verb:
    description: >-
      One of prepare, commit, push; the unlisted prompt; or doctor. Not
      pause: `args` is split on whitespace and a pause preamble is a
      sentence, so it runs from PATH in the workflow's own run: steps.
      Empty means setup only: the pinned binaries are installed
      and no verb runs, which is how a job puts falconet on PATH before its
      first verb.
    required: false
    default: ''
  args:
    description: >-
      Arguments for the verb, split on whitespace. NEVER pass issue text
      here — see the note in the run step. Files and environment variables
      are how attacker-controlled text travels.
    required: false
    default: ''
  working-directory:
    description: 'The repository the verb operates on. Defaults to the checkout.'
    required: false
    default: '.'
  setup:
    description: >-
      Install the pinned binaries. Leave true on the first call in a job and
      set false afterwards; the installs are idempotent but not free.
    required: false
    default: 'true'
  gitleaks-version:
    description: 'Pinned gitleaks release.'
    required: false
    default: '8.30.1'
  gitleaks-sha256:
    description: >-
      SHA-256 of the linux_x64 asset. The version pins WHAT is fetched; this
      pins what arrives, because a tag is a mutable pointer and a release
      asset can be replaced. Bump the two together — if they disagree the
      step fails, and no scan is ever skipped silently.
    required: false
    default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

outputs:
  outcome:
    description: 'The one word the verb printed on stdout, for the verbs that print one.'
    value: ${{ steps.run.outputs.outcome }}

runs:
  using: composite
  steps:
    # The BINARY, not gitleaks/gitleaks-action: the action's licence
    # distinguishes individual users from organisations and asks the second
    # kind for a key, and falconet would rather ship something a person can
    # also run by hand.
    #
    # `gitleaks version` last: proof that what came out of the tarball
    # actually runs, on this runner, before anything depends on it. The scan
    # fails closed on a missing binary, so a broken install pauses the issue
    # rather than publishing unscanned text — but failing here is better than
    # failing there.
    - name: Install gitleaks (pinned)
      if: inputs.setup == 'true'
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
      run: |
        set -euo pipefail
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks version
          exit 0
        fi
        asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$url"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$RUNNER_TEMP/gitleaks" "$HOME/.local/bin/gitleaks"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/gitleaks" version

    # falconet itself, the way gitleaks is installed: a version, a URL, and a
    # digest. All three come out of this action's own checkout — GitHub
    # fetched it into the runner's action cache at the ref the caller's
    # `uses:` named — so release/VERSION is the tag `make release-prep` wrote
    # and release/falconet_linux_amd64.sha256 is the digest it computed of the
    # bytes release.yml refused to publish unless they reproduced (ADR-0006
    # D6). The asset is bare-named because the version is already in the
    # URL's path. No token: the release is public.
    #
    # Unlike gitleaks, a falconet already on PATH is NOT taken on sight. The
    # gitleaks short-circuit saves a download of a scanner this action does
    # not otherwise reason about; this binary is the one the whole workflow
    # is pinned to, and a runner image or an earlier step that left a
    # different falconet on PATH would have every verb run a version the
    # consumer's pin never named, silently. The same version: say so and
    # skip. Anything else: install the pinned one in front of it.
    #
    # The digest is checked BEFORE install, and `falconet version` runs LAST
    # and must begin with the pinned version: a tag is a mutable pointer and
    # a release asset can be replaced, and what came off the network has to
    # both hash right and actually run, on this runner, before anything
    # depends on it. A binary that reports any other version is not the one
    # the tree describes, whatever its bytes hashed to.
    - name: Install falconet (pinned)
      if: inputs.setup == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="$(cat "$GITHUB_ACTION_PATH/release/VERSION")"
        sha="$(awk '{print $1}' "$GITHUB_ACTION_PATH/release/falconet_linux_amd64.sha256")"
        if command -v falconet >/dev/null 2>&1; then
          have="$(falconet version 2>/dev/null || true)"
          case "$have" in
            "falconet $version "*)
              echo "falconet $version is already on PATH at $(command -v falconet)"
              exit 0 ;;
          esac
          echo "a different falconet is on PATH at $(command -v falconet) (${have:-no version}); installing $version in front of it"
        fi
        file="$RUNNER_TEMP/falconet_linux_amd64"
        url="https://github.com/zetlen/falconet/releases/download/${version}/falconet_linux_amd64"
        curl -fsSL --retry 3 -o "$file" "$url"
        echo "$sha  $file" | sha256sum -c -
        dest="$HOME/.local/bin"
        mkdir -p "$dest"
        install -m 0755 "$file" "$dest/falconet"
        echo "$dest" >> "$GITHUB_PATH"
        have="$("$dest/falconet" version)"
        case "$have" in
          "falconet $version "*) echo "$have" ;;
          *) echo "the installed falconet reports '$have', not $version" >&2; exit 1 ;;
        esac

    # The verb and its arguments reach the shell through the ENVIRONMENT, not
    # through a template expression. That is not style: an issue title, body
    # or comment interpolated into a `run:` block is a shell injection with
    # the requester holding the keyboard, and the whole reason the six verbs
    # take files rather than strings is so that text never has to travel this
    # way. $FALCONET_ARGS is deliberately unquoted so a caller can pass
    # several arguments — which is exactly why a caller must never put issue
    # text in it.
    #
    # Skipped when no verb was asked for: a call with an empty `verb` is an
    # install and nothing else, and `outcome` is then empty.
    - name: Run
      id: run
      if: inputs.verb != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FALCONET_VERB: ${{ inputs.verb }}
        FALCONET_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        # shellcheck disable=SC2086
        outcome="$(falconet "$FALCONET_VERB" $FALCONET_ARGS)"
        rc=$?
        printf '%s\n' "$outcome"
        # Written with a delimiter, not `name=value`. The verbs that decide
        # something print one word, but `push` once printed a sentence, and
        # `name=` with a newline in the value is "Invalid format" — a step
        # that had already done its work failing on the way out, taking the
        # pull request with it. The delimiter form is legal whatever a verb
        # prints, so no verb's stdout can break the step that ran it again.
        {
          echo "outcome<<FALCONET_OUTCOME_EOF"
          printf '%s\n' "$outcome"
          echo FALCONET_OUTCOME_EOF
        } >> "$GITHUB_OUTPUT"
        exit "$rc"
